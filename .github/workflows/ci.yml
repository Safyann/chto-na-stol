name: Check and build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source and run tests
        run: npm run check
      - name: Build PWA
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: chto-na-stol-pwa
          path: dist/
          if-no-files-found: error
